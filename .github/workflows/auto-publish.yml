name: Auto Publish

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'deepsel/**'
      - 'pyproject.toml'

concurrency:
  group: auto-publish
  cancel-in-progress: false

jobs:
  wait-for-checks:
    if: github.repository_owner == 'DeepselSystems'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for all other workflows to pass
        uses: actions/github-script@v7
        with:
          script: |
            await new Promise(r => setTimeout(r, 30000));

            for (let i = 0; i < 60; i++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: context.sha,
              });

              const otherRuns = data.workflow_runs.filter(r => r.name !== 'Auto Publish');

              if (otherRuns.length === 0) {
                core.info('No other workflows found, proceeding');
                return;
              }

              const pending = otherRuns.filter(r => r.status !== 'completed');
              const failed = otherRuns.filter(r =>
                r.status === 'completed' &&
                r.conclusion !== 'success' &&
                r.conclusion !== 'skipped'
              );

              if (failed.length > 0) {
                const names = failed.map(r => `${r.name} (${r.conclusion})`).join(', ');
                core.setFailed(`Workflows failed: ${names}`);
                return;
              }

              if (pending.length === 0) {
                core.info(`All ${otherRuns.length} workflows passed`);
                return;
              }

              core.info(`Waiting... ${pending.length} still running: ${pending.map(r => r.name).join(', ')}`);
              await new Promise(r => setTimeout(r, 30000));
            }

            core.setFailed('Timed out waiting for workflows');

  detect-unpublished:
    needs: wait-for-checks
    runs-on: ubuntu-latest
    outputs:
      cms-utils: ${{ steps.check.outputs.cms-utils }}
      cms-utils-version: ${{ steps.check.outputs.cms-utils-version }}
      cms-react: ${{ steps.check.outputs.cms-react }}
      cms-react-version: ${{ steps.check.outputs.cms-react-version }}
      admin: ${{ steps.check.outputs.admin }}
      admin-version: ${{ steps.check.outputs.admin-version }}
      python: ${{ steps.check.outputs.python }}
      python-version: ${{ steps.check.outputs.python-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Check registries
        id: check
        run: |
          check_npm() {
            local pkg_dir="$1"
            local pkg_name="$2"
            local output_name="$3"

            LOCAL_VERSION=$(jq -r '.version' "packages/$pkg_dir/package.json")
            PUBLISHED=$(npm view "$pkg_name@$LOCAL_VERSION" version 2>/dev/null || echo "")

            if [ -z "$PUBLISHED" ]; then
              echo "$output_name=true" >> $GITHUB_OUTPUT
              echo "$output_name-version=$LOCAL_VERSION" >> $GITHUB_OUTPUT
              echo "::notice::$pkg_name@$LOCAL_VERSION not on npm, will publish"
            else
              echo "$output_name=false" >> $GITHUB_OUTPUT
              echo "::notice::$pkg_name@$LOCAL_VERSION already published, skipping"
            fi
          }

          check_npm "cms-utils" "@deepsel/cms-utils" "cms-utils"
          check_npm "cms-react" "@deepsel/cms-react" "cms-react"
          check_npm "admin" "@deepsel/admin" "admin"

          # Check PyPI
          PYTHON_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/deepsel/$PYTHON_VERSION/json")

          if [ "$HTTP_CODE" = "404" ]; then
            echo "python=true" >> $GITHUB_OUTPUT
            echo "python-version=$PYTHON_VERSION" >> $GITHUB_OUTPUT
            echo "::notice::deepsel==$PYTHON_VERSION not on PyPI, will publish"
          else
            echo "python=false" >> $GITHUB_OUTPUT
            echo "::notice::deepsel==$PYTHON_VERSION already published, skipping"
          fi

  publish-cms-utils:
    needs: detect-unpublished
    if: needs.detect-unpublished.outputs.cms-utils == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          registry-url: https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ""

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --workspace=packages/cms-utils

      - name: Publish
        run: |
          npm publish --provenance --workspace=packages/cms-utils || {
            PUBLISHED=$(npm view "@deepsel/cms-utils@$(jq -r '.version' packages/cms-utils/package.json)" version 2>/dev/null || echo "")
            if [ -n "$PUBLISHED" ]; then
              echo "::warning::Version already published by another process, continuing"
              exit 0
            fi
            exit 1
          }

  publish-cms-react:
    needs: [detect-unpublished, publish-cms-utils]
    if: needs.detect-unpublished.outputs.cms-react == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          registry-url: https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ""

      - name: Install dependencies
        run: npm ci

      - name: Build cms-utils
        run: npm run build --workspace=packages/cms-utils

      - name: Build cms-react
        run: npm run build --workspace=packages/cms-react

      - name: Publish
        run: |
          npm publish --provenance --workspace=packages/cms-react || {
            PUBLISHED=$(npm view "@deepsel/cms-react@$(jq -r '.version' packages/cms-react/package.json)" version 2>/dev/null || echo "")
            if [ -n "$PUBLISHED" ]; then
              echo "::warning::Version already published by another process, continuing"
              exit 0
            fi
            exit 1
          }

  publish-admin:
    needs: [detect-unpublished, publish-cms-utils, publish-cms-react]
    if: needs.detect-unpublished.outputs.admin == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          registry-url: https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ""

      - name: Install dependencies
        run: npm ci

      - name: Ensure SWC native binding
        run: npm install --no-save @swc/core-linux-x64-gnu@1.15.17 || true

      - name: Build workspace dependencies
        run: |
          npm run build --workspace=packages/cms-utils
          npm run build --workspace=packages/cms-react

      - name: Build library
        run: npm run build:lib --workspace=@deepsel/admin

      - name: Publish
        run: |
          npm publish --provenance --workspace=@deepsel/admin || {
            PUBLISHED=$(npm view "@deepsel/admin@$(jq -r '.version' packages/admin/package.json)" version 2>/dev/null || echo "")
            if [ -n "$PUBLISHED" ]; then
              echo "::warning::Version already published by another process, continuing"
              exit 0
            fi
            exit 1
          }

  publish-python:
    needs: detect-unpublished
    if: needs.detect-unpublished.outputs.python == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          make install-dev

      - name: Build and check
        run: make check-dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  create-tags:
    needs: [detect-unpublished, publish-cms-utils, publish-cms-react, publish-admin, publish-python]
    if: always() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create tags for published packages
        run: |
          TAGS_CREATED=false

          if [ "${{ needs.publish-cms-utils.result }}" = "success" ]; then
            git tag "cms-utils-v${{ needs.detect-unpublished.outputs.cms-utils-version }}"
            TAGS_CREATED=true
            echo "::notice::Tagged cms-utils-v${{ needs.detect-unpublished.outputs.cms-utils-version }}"
          fi

          if [ "${{ needs.publish-cms-react.result }}" = "success" ]; then
            git tag "cms-react-v${{ needs.detect-unpublished.outputs.cms-react-version }}"
            TAGS_CREATED=true
            echo "::notice::Tagged cms-react-v${{ needs.detect-unpublished.outputs.cms-react-version }}"
          fi

          if [ "${{ needs.publish-admin.result }}" = "success" ]; then
            git tag "admin-v${{ needs.detect-unpublished.outputs.admin-version }}"
            TAGS_CREATED=true
            echo "::notice::Tagged admin-v${{ needs.detect-unpublished.outputs.admin-version }}"
          fi

          if [ "${{ needs.publish-python.result }}" = "success" ]; then
            git tag "v${{ needs.detect-unpublished.outputs.python-version }}"
            TAGS_CREATED=true
            echo "::notice::Tagged v${{ needs.detect-unpublished.outputs.python-version }}"
          fi

          if [ "$TAGS_CREATED" = "true" ]; then
            git push origin --tags
          fi
